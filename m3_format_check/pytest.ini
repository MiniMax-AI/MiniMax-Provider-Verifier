[pytest]
testpaths = .
# Test files use the m3_*_tests.py naming convention.
python_files = m3_*_tests.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    probabilistic: asserts model behaviour (content, counts, tool use, thinking) that varies between runs; format runs deselect it with '-m "not probabilistic"'
addopts = --tb=short --timeout=1800 -rfE
timeout = 1800
