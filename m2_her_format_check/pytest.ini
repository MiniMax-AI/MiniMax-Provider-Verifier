[pytest]
testpaths = .
python_files = m2_her_*_tests.py
python_classes = Test*
python_functions = test_*
addopts = --import-mode=importlib --tb=short -ra
markers =
    implementation: native fields confirmed by service implementation, distinct from public OpenAPI
    slow: long inputs; enable with --run-slow
    compat: project acceptance baseline; enable with --run-compat, optionally override with --contract
